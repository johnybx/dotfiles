general {
    lock_cmd = pidof hyprlock || hyprlock && loginctl unlock-session  # avoid starting multiple hyprlock instances. Send unlock dbus message so that unlock_cmd is triggered ( and anything else listening )
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    # unlock_cmd = killall -SIGUSR2 waybar # refresh waybar - sometimes there are multiple bars after suspend
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 30
    on-resume = brightnessctl -r
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 150
    on-timeout = brightnessctl -sd platform::kbd_backlight set 0
    on-resume = brightnessctl -rd platform::kbd_backlight
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 900
    on-timeout = upower -i `upower -e | grep 'BAT'` | grep 'state:' | head -n 1 | grep -q 'discharging' && systemctl suspend
}

listener {
    timeout = 3600
    on-timeout = systemctl suspend
}
